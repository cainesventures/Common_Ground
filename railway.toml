[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"
  # Only rebuild + redeploy when backend-relevant files change.  Frontend
  # commits (frontend/**), workflow updates (.github/**), scripts run only
  # on dev (scripts/**), and docs don't need a Railway restart — every
  # restart costs ~40 Backblaze Class C calls and there's no behavioral
  # change to deploy anyway.
  watchPatterns = [
    "app/**",
    "main.py",
    "requirements.txt",
    "Dockerfile",
    "alembic/**",
    "alembic.ini",
    "litestream*.yml",
    "railway.toml",
  ]

[deploy]
  # Startup logic (see also app/models/database.py:init_db for the schema side):
  #
  #   content.db — dev source of truth.
  #     * On DB_RESTORE_VERSION change: wipe and restore from B2.
  #     * On missing file: restore from B2.
  #
  #   users.db   — prod source of truth.
  #     * Never wiped.  Only restored if missing (fresh deploy / lost volume).
  #     * On first split-aware deploy the file won't exist on prod yet AND B2
  #       won't have a backup yet; restore fails silently and the app's
  #       init_db creates the schema + copies any legacy user rows out of
  #       content.db (one-shot, idempotent).
  #
  # NOTE: Continuous `litestream replicate` is intentionally NOT run here.
  # Litestream v0.5's internal L0 retention enforcement loop makes ~15s
  # ListObjectsV2 calls regardless of sync-interval settings, which torches
  # Backblaze's free-tier Class C cap (2,500/day) in a few hours.  Trade-off:
  # ongoing prod writes to users.db are not backed up between deploys; if
  # Railway's volume dies, user data is lost.  Acceptable for current scale.
  # When we want backups back, do it via a periodic backup job (e.g. nightly
  # one-shot litestream replicate triggered by GitHub Actions or cron) so we
  # control the cadence instead of letting Litestream poll continuously.
  startCommand = "sh -c 'STORED=$(cat /data/.restore_version 2>/dev/null || echo \"\"); TARGET=\"${DB_RESTORE_VERSION:-}\"; if [ -n \"$TARGET\" ] && [ \"$STORED\" != \"$TARGET\" ]; then rm -f /data/common_ground.db && litestream restore -config /app/litestream.railway.yml /data/common_ground.db && echo \"$TARGET\" > /data/.restore_version; elif [ ! -f /data/common_ground.db ]; then litestream restore -config /app/litestream.railway.yml /data/common_ground.db; fi; if [ ! -f /data/users.db ]; then litestream restore -config /app/litestream.railway.yml /data/users.db 2>/dev/null || echo \"(no users.db backup yet — will be created by init_db)\"; fi; exec uvicorn main:app --host 0.0.0.0 --port $PORT'"
  healthcheckPath = "/health"
  healthcheckTimeout = 120
  restartPolicyType = "ON_FAILURE"
