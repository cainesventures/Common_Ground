[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "sh -c 'rm -f /data/common_ground.db && litestream restore -config /app/litestream.railway.yml /data/common_ground.db && uvicorn main:app --host 0.0.0.0 --port $PORT'"
  healthcheckPath = "/health"
  healthcheckTimeout = 120
  restartPolicyType = "ON_FAILURE"
