name: Bluesky Engagement Tracker

on:
  schedule:
    - cron: '0 17 * * *'  # 1pm ET daily — after morning post has had time to accumulate engagement
  workflow_dispatch:       # allow manual trigger from GitHub Actions tab

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run engagement tracker
        run: python workers/bluesky_engagement.py
        env:
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
          API_BASE: https://opencommonground-api-production.up.railway.app
